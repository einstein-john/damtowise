<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Damtowise</title>
    <meta
      name="description"
      content="That page doesn't exist. Head back to the Damtowise portfolio."
    />
    <!-- A 404 must never be indexed, and must never compete with the real pages. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://damtowise.xyz/" />
    <meta name="theme-color" content="#0A0A0A" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #000;
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: center;
      }
      main {
        max-width: 34rem;
        display: grid;
        gap: 1.5rem;
        justify-items: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 6rem);
        line-height: 1;
        color: #ff6600;
      }
      p {
        margin: 0;
        color: #999;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }
      a {
        color: #ff6600;
        text-decoration: none;
        border: 1px solid rgba(255, 102, 0, 0.35);
        border-radius: 0.5rem;
        padding: 0.6rem 1rem;
        transition: background-color 0.2s ease;
      }
      a:hover,
      a:focus-visible {
        background: rgba(255, 102, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <p><span aria-hidden="true">&lt;</span>Damtowise<span aria-hidden="true"> /&gt;</span></p>
      <h1>404</h1>
      <p>
        That page doesn't exist — it may have moved, or the link that brought you here was wrong.
      </p>
      <nav aria-label="Site sections">
        <a href="/">Home</a>
        <a href="/#projects">Projects</a>
        <a href="/#stack">Tech Stack</a>
        <a href="/fyi">FYI</a>
      </nav>
    </main>
  </body>
</html>
